[package]
name = "gba-image-packer-android"
version = "1.0.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
name = "gba_packer"
crate-type = ["cdylib"]

[dependencies]
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png", "bmp"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
jni = "=0.21.1"

[profile.release]
lto = "thin"
strip = true
