[package]
name = "gba-image-packer"
version = "1.0.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/NewBarkTownKris/gba-image-packer"
description = "Build Game Boy Advance image albums and slideshows"

[dependencies]
tinyfiledialogs = "3.9.1"
macroquad = "0.4.16"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "bmp"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
lto = "thin"
strip = true
